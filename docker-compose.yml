name: messaging-php

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["redis"]

  beanstalkd:
    image: schickling/beanstalkd:latest
    ports:
      - "11300:11300"
    profiles: ["beanstalkd"]

  nsqlookupd:
    image: nsqio/nsq:v1.3.0
    command: /nsqlookupd
    ports:
      - "4160:4160"
      - "4161:4161"
    profiles: ["nsq"]

  nsqd:
    image: nsqio/nsq:v1.3.0
    command: /nsqd --broadcast-address=127.0.0.1 --lookupd-tcp-address=nsqlookupd:4160
    ports:
      - "4150:4150"
      - "4151:4151"
    depends_on:
      - nsqlookupd
    profiles: ["nsq"]

  activemq:
    image: apache/activemq-classic:latest
    ports:
      - "61613:61613"
      - "8161:8161"
    profiles: ["activemq"]

  artemis:
    image: apache/artemis:latest
    ports:
      - "61616:61616"
      - "61614:61613"
      - "8162:8161"
    profiles: ["artemis"]

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: messaging
      RABBITMQ_DEFAULT_PASS: messaging
    ports:
      - "5672:5672"
      - "15672:15672"
    profiles: ["rabbitmq"]

  nats:
    image: nats:2.10-alpine
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"
    profiles: ["nats"]

  moto:
    image: motoserver/moto:latest
    ports:
      - "5000:5000"
    profiles: ["aws"]

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=test-project"
    ports:
      - "8085:8085"
    profiles: ["gcp"]
