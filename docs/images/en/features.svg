<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="feat-title feat-desc">
  <title id="feat-title">messaging-php Feature Design</title>
  <desc id="feat-desc">Six capability areas: unified API, capability model, driver registry, pure PHP transport, framework integration and testing.</desc>
  <style>
    text{font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#14213D}
    .title{font-size:22px;font-weight:700}
    .sub{font-size:11.5px;fill:#5B6478}
    .ct{font-size:14px;font-weight:700}
    .ce{font-size:9.5px;fill:#8A94A6}
    .b{font-size:10px;fill:#334155}
    .num{font-size:11px;font-weight:700;fill:#2563EB}
    .foot{font-size:9.6px;fill:#5B6478}
    .ctr{text-anchor:middle}
  </style>

  <rect x="0" y="0" width="960" height="540" fill="#FFFFFF"/>
  <text class="title" x="48" y="42">messaging-php Feature Design</text>
  <text class="sub" x="912" y="42" text-anchor="end">Feature Map · six capability areas</text>
  <text class="sub" x="48" y="64">Unified API → capability negotiation → driver registry → pure PHP transport → framework integration → tests</text>

  <!-- 卡片 1 统一 API -->
  <rect x="44" y="84" width="272" height="188" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.4"/>
  <rect x="44" y="104" width="4" height="26" rx="2" fill="#2563EB"/>
  <circle cx="70" cy="117" r="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
  <text class="num ctr" x="70" y="121">1</text>
  <text class="ct" x="92" y="113">Unified API</text>
  <text class="ce" x="92" y="128">One calling convention</text>
  <line x1="68" y1="142" x2="292" y2="142" stroke="#E2E8F0" stroke-width="1"/>
  <text class="b" x="68" y="164">· publish / publishBatch to send</text>
  <text class="b" x="68" y="186">· receive / consume pull loop</text>
  <text class="b" x="68" y="208">· ack() / reject(requeue) commits</text>
  <text class="b" x="68" y="230">· Message::json, ReceivedMessage</text>

  <!-- 卡片 2 能力模型 -->
  <rect x="344" y="84" width="272" height="188" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.4"/>
  <rect x="344" y="104" width="4" height="26" rx="2" fill="#2563EB"/>
  <circle cx="370" cy="117" r="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
  <text class="num ctr" x="370" y="121">2</text>
  <text class="ct" x="392" y="113">Capability model</text>
  <text class="ce" x="392" y="128">Explicit capabilities</text>
  <line x1="368" y1="142" x2="592" y2="142" stroke="#E2E8F0" stroke-width="1"/>
  <text class="b" x="368" y="164">· ack · requeue · delay · batch</text>
  <text class="b" x="368" y="186">· consumerGroups · ordering · headers</text>
  <text class="b" x="368" y="208">· capabilities() at runtime</text>
  <text class="b" x="368" y="230">· throws instead of silent fallback</text>

  <!-- 卡片 3 驱动注册表 -->
  <rect x="644" y="84" width="272" height="188" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.4"/>
  <rect x="644" y="104" width="4" height="26" rx="2" fill="#2563EB"/>
  <circle cx="670" cy="117" r="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
  <text class="num ctr" x="670" y="121">3</text>
  <text class="ct" x="692" y="113">Driver registry</text>
  <text class="ce" x="692" y="128">By name, lazily</text>
  <line x1="668" y1="142" x2="892" y2="142" stroke="#E2E8F0" stroke-width="1"/>
  <text class="b" x="668" y="164">· 20 product names · 13 stacks</text>
  <text class="b" x="668" y="186">· built-in factories on demand</text>
  <text class="b" x="668" y="208">· Manager::extend() for custom</text>
  <text class="b" x="668" y="230">· lazy connections, cached by name</text>

  <!-- 卡片 4 纯 PHP 传输 -->
  <rect x="44" y="292" width="272" height="188" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.4"/>
  <rect x="44" y="312" width="4" height="26" rx="2" fill="#D97706"/>
  <circle cx="70" cy="325" r="12" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
  <text class="num ctr" x="70" y="329" style="fill:#B45309">4</text>
  <text class="ct" x="92" y="321">Pure PHP transport</text>
  <text class="ce" x="92" y="336">Pure PHP transports</text>
  <line x1="68" y1="350" x2="292" y2="350" stroke="#E2E8F0" stroke-width="1"/>
  <text class="b" x="68" y="372">· stream_socket_client for TCP/TLS</text>
  <text class="b" x="68" y="394">· in-house RESP / STOMP / NATS / NSQ</text>
  <text class="b" x="68" y="416">· cloud: Guzzle + SigV4 / JWT / SAS</text>
  <text class="b" x="68" y="438">· no rdkafka / ext-zmq / ext-redis</text>

  <!-- 卡片 5 框架集成 -->
  <rect x="344" y="292" width="272" height="188" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.4"/>
  <rect x="344" y="312" width="4" height="26" rx="2" fill="#D97706"/>
  <circle cx="370" cy="325" r="12" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
  <text class="num ctr" x="370" y="329" style="fill:#B45309">5</text>
  <text class="ct" x="392" y="321">Framework integration</text>
  <text class="ce" x="392" y="336">Container, facade, DI</text>
  <line x1="368" y1="350" x2="592" y2="350" stroke="#E2E8F0" stroke-width="1"/>
  <text class="b" x="368" y="372">· Laravel · ThinkPHP · webman</text>
  <text class="b" x="368" y="394">· Hyperf · Yii2 · Yii3</text>
  <text class="b" x="368" y="416">· Manager bound in the container</text>
  <text class="b" x="368" y="438">· config publish · facade / DI</text>

  <!-- 卡片 6 测试体系 -->
  <rect x="644" y="292" width="272" height="188" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.4"/>
  <rect x="644" y="312" width="4" height="26" rx="2" fill="#D97706"/>
  <circle cx="670" cy="325" r="12" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
  <text class="num ctr" x="670" y="329" style="fill:#B45309">6</text>
  <text class="ct" x="692" y="321">Testing</text>
  <text class="ce" x="692" y="336">Four test layers</text>
  <line x1="668" y1="350" x2="892" y2="350" stroke="#E2E8F0" stroke-width="1"/>
  <text class="b" x="668" y="372">· unit tests + fake broker tests</text>
  <text class="b" x="668" y="394">· DriverContractTestCase base</text>
  <text class="b" x="668" y="416">· Docker Compose integration profiles</text>
  <text class="b" x="668" y="438">· PHPStan · PHP-CS-Fixer · CI matrix</text>

  <!-- 底部能力条 -->
  <rect x="44" y="500" width="872" height="28" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
  <text class="foot ctr" x="480" y="518">PSR-3 logging · unified exceptions · array config · PHP &gt;= 8.0 · no broker SDK or extension</text>
</svg>
