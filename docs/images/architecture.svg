<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">messaging-php 架构设计</title>
  <desc id="arch-desc">自上而下四层：框架适配层、核心层、驱动适配层、Broker 与云服务层。20 个产品名由 13 套协议栈承载，P1-P5 已实现的 20 个驱动名全部高亮显示。</desc>
  <style>
    text{font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#14213D}
    .title{font-size:22px;font-weight:700}
    .sub{font-size:11.5px;fill:#5B6478}
    .lane{font-size:12.5px;font-weight:700}
    .lane-en{font-size:9.5px;fill:#8A94A6}
    .n{font-size:11.5px;font-weight:600}
    .ns{font-size:9px;fill:#5B6478}
    .p1n{font-size:12px;font-weight:700;fill:#92400E}
    .p1s{font-size:9px;fill:#B45309}
    .note{font-size:10px;fill:#5B6478}
    .ctr{text-anchor:middle}
  </style>
  <defs>
    <marker id="arw-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#2563EB"/>
    </marker>
    <marker id="arw-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="#FFFFFF"/>
  <text class="title" x="48" y="42">messaging-php 架构设计</text>
  <text class="sub" x="912" y="42" text-anchor="end">纯 PHP · 20 系统 · 统一 API</text>
  <text class="sub" x="48" y="64">应用只依赖 Manager / Connection；驱动按协议分组，能力差异显式声明</text>

  <!-- 框架适配层 -->
  <rect x="40" y="80" width="880" height="68" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="56" y="92" width="4" height="14" rx="2" fill="#2563EB"/>
  <text class="lane" x="68" y="104">框架适配层</text>
  <text class="lane-en" x="146" y="104">Framework Adapters · 可选</text>
  <g>
    <rect x="61" y="112" width="128" height="28" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text class="n ctr" x="125" y="130">Laravel</text>
    <rect x="203" y="112" width="128" height="28" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text class="n ctr" x="267" y="130">ThinkPHP</text>
    <rect x="345" y="112" width="128" height="28" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text class="n ctr" x="409" y="130">webman</text>
    <rect x="487" y="112" width="128" height="28" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text class="n ctr" x="551" y="130">Hyperf</text>
    <rect x="629" y="112" width="128" height="28" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text class="n ctr" x="693" y="130">Yii2</text>
    <rect x="771" y="112" width="128" height="28" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text class="n ctr" x="835" y="130">Yii3</text>
  </g>
  <line x1="480" y1="148" x2="480" y2="166" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arw-blue)"/>

  <!-- 核心层 -->
  <rect x="40" y="168" width="880" height="66" rx="12" fill="#EFF6FF" stroke="#BFDBFE"/>
  <rect x="56" y="180" width="4" height="14" rx="2" fill="#2563EB"/>
  <text class="lane" x="68" y="192">核心层</text>
  <text class="lane-en" x="126" y="192">Core · 与协议无关</text>
  <g>
    <rect x="76" y="199" width="190" height="27" rx="7" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
    <text class="n ctr" x="171" y="216">Config 配置校验</text>
    <rect x="282" y="199" width="190" height="27" rx="7" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
    <text class="n ctr" x="377" y="216">Manager 连接管理</text>
    <rect x="488" y="199" width="190" height="27" rx="7" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
    <text class="n ctr" x="583" y="216">Connection 统一门面</text>
    <rect x="694" y="199" width="190" height="27" rx="7" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
    <text class="n ctr" x="789" y="216">DriverInterface 驱动契约</text>
  </g>
  <line x1="480" y1="234" x2="480" y2="250" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arw-blue)"/>

  <!-- 驱动适配层 -->
  <rect x="40" y="252" width="880" height="172" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="56" y="264" width="4" height="14" rx="2" fill="#2563EB"/>
  <text class="lane" x="68" y="276">驱动适配层</text>
  <text class="lane-en" x="146" y="276">Driver Adapters · 20 个产品名 / 13 套协议栈</text>
  <g>
    <rect x="57" y="284" width="158" height="48" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
    <text class="p1n ctr" x="136" y="303">STOMP 1.2</text>
    <text class="p1s ctr" x="136" y="318">P1 · ActiveMQ / Artemis</text>
    <rect x="229" y="284" width="158" height="48" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
    <text class="p1n ctr" x="308" y="303">RESP</text>
    <text class="p1s ctr" x="308" y="318">P1 · Redis Streams</text>
    <rect x="401" y="284" width="158" height="48" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
    <text class="p1n ctr" x="480" y="303">NATS 文本协议</text>
    <text class="p1s ctr" x="480" y="318">P1 · NATS Core</text>
    <rect x="573" y="284" width="158" height="48" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
    <text class="p1n ctr" x="652" y="303">NSQ TCP</text>
    <text class="p1s ctr" x="652" y="318">P1 · nsq</text>
    <rect x="745" y="284" width="158" height="48" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
    <text class="p1n ctr" x="824" y="303">Beanstalkd 文本协议</text>
    <text class="p1s ctr" x="824" y="318">P1 · beanstalkd</text>
  </g>
  <g>
    <rect x="53" y="338" width="98" height="46" rx="7" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
    <text class="p1n ctr" x="102" y="355">AMQP 0-9-1</text>
    <text class="p1s ctr" x="102" y="369">P3 · rabbitmq</text>
    <rect x="161" y="338" width="98" height="46" rx="7" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
    <text class="p1n ctr" x="210" y="355">Kafka</text>
    <text class="p1s ctr" x="210" y="369">P4 · Kafka 系 5 驱动</text>
    <rect x="269" y="338" width="98" height="46" rx="7" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
    <text class="p1n ctr" x="318" y="355">Pulsar</text>
    <text class="p1s ctr" x="318" y="369">P5 · pulsar</text>
    <rect x="377" y="338" width="98" height="46" rx="7" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
    <text class="p1n ctr" x="426" y="355">RocketMQ</text>
    <text class="p1s ctr" x="426" y="369">P5 · rocketmq</text>
    <rect x="485" y="338" width="98" height="46" rx="7" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
    <text class="p1n ctr" x="534" y="355">AWS</text>
    <text class="p1s ctr" x="534" y="369">P2 · sqs/sns/kinesis</text>
    <rect x="593" y="338" width="98" height="46" rx="7" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
    <text class="p1n ctr" x="642" y="355">GCP</text>
    <text class="p1s ctr" x="642" y="369">P2 · gcp-pubsub</text>
    <rect x="701" y="338" width="98" height="46" rx="7" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
    <text class="p1n ctr" x="750" y="355">Azure</text>
    <text class="p1s ctr" x="750" y="369">P2 · azure-service-bus</text>
    <rect x="809" y="338" width="98" height="46" rx="7" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
    <text class="p1n ctr" x="858" y="355">ZMTP 3.1</text>
    <text class="p1s ctr" x="858" y="369">P3 · zeromq</text>
  </g>
  <rect x="57" y="391" width="10" height="10" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
  <text class="note" x="73" y="400">P1-P5 全部 20 个驱动名已实现</text>
  <text class="note" x="903" y="400" text-anchor="end">DriverFactory 按驱动名创建 · 连接懒加载缓存</text>
  <line x1="480" y1="424" x2="480" y2="442" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arw-blue)"/>

  <!-- Broker / 云服务层 -->
  <rect x="40" y="444" width="880" height="74" rx="12" fill="#F1F5F9" stroke="#E2E8F0"/>
  <rect x="56" y="456" width="4" height="14" rx="2" fill="#2563EB"/>
  <text class="lane" x="68" y="468">Broker / 云服务层</text>
  <text class="lane-en" x="176" y="468">Infrastructure · 存储、路由、确认与重投</text>
  <g>
    <rect x="60" y="474" width="410" height="36" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text class="ns ctr" x="265" y="488">RabbitMQ · Kafka · Pulsar · RocketMQ · NATS</text>
    <text class="ns ctr" x="265" y="502">ActiveMQ / Artemis · Redis · NSQ · Beanstalkd · ZeroMQ</text>
    <rect x="490" y="474" width="410" height="36" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text class="ns ctr" x="695" y="488">AWS SQS / SNS / Kinesis · GCP Pub/Sub</text>
    <text class="ns ctr" x="695" y="502">Azure Service Bus / Event Hubs（Kafka 端点）</text>
  </g>
  <text class="note" x="48" y="534">高亮为 P1-P5 全部 20 个驱动名；所有驱动复用同一 DriverInterface，完成情况见 docs/drivers.md</text>
</svg>
