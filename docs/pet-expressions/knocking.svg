  .ex-anim-shock { animation: ex-shock 0.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes ex-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
  @keyframes ex-bounce { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-6px); } 60% { transform: translateY(-2px); } }
  @keyframes ex-tremble { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-1px); } 75% { transform: translateX(1px); } }
  @keyframes ex-sway { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(2deg); } }
  @keyframes ex-shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-4.24px); } 40% { transform: translateX(4.24px); } 60% { transform: translateX(-2.75px); } 80% { transform: translateX(1.75px); } }
  @keyframes ex-tear { 0% { transform: translateY(0); opacity: 0; } 18% { opacity: 1; } 100% { transform: translateY(8.58px); opacity: 0; } }
