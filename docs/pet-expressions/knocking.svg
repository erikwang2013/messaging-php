  <title>信使仓鼠小递 · 敲打 Knocking</title>
  <desc>小递的「敲打」表情：一脸认真，右爪一下一下敲着，旁边出现敲击弧线。</desc>
  <style>
  .ex-motion { animation: ex-bob 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
