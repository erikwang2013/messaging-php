name: Integration

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: redis
            filter: RedisStreams
            port: 6379
          - profile: beanstalkd
            filter: Beanstalkd
            port: 11300
          - profile: nsq
            filter: Nsq
            port: 4150
          - profile: nats
            filter: Nats
            port: 4222
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - run: docker compose --profile ${{ matrix.profile }} up -d

      - name: Wait for broker
        run: |
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/${{ matrix.port }}) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose --profile ${{ matrix.profile }} logs
          exit 1

      - run: vendor/bin/phpunit --testsuite integration --filter ${{ matrix.filter }}

      - if: always()
        run: docker compose --profile ${{ matrix.profile }} down -v

  heavy:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MESSAGING_AWS_ENDPOINT: http://127.0.0.1:5000
      MESSAGING_AWS_REGION: us-east-1
      MESSAGING_AWS_ACCESS_KEY: test
      MESSAGING_AWS_SECRET_KEY: test
      MESSAGING_PUBSUB_EMULATOR_HOST: 127.0.0.1:8085
      MESSAGING_GCP_PROJECT: test-project
      MESSAGING_RABBITMQ_USER: messaging
      MESSAGING_RABBITMQ_PASS: messaging
      MESSAGING_KAFKA_BROKERS: 127.0.0.1:9092
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: activemq
            filter: ActiveMq
            port: 61613
          - profile: artemis
            filter: Artemis
            port: 61614
          - profile: aws
            filter: 'Sqs|Sns|Kinesis'
            port: 5000
          - profile: gcp
            filter: PubSub
            port: 8085
          - profile: rabbitmq
            filter: RabbitMq
            port: 5672
          - profile: kafka
            filter: Kafka
            port: 9092
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - run: docker compose --profile ${{ matrix.profile }} up -d

      - name: Wait for broker
        run: |
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/${{ matrix.port }}) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose --profile ${{ matrix.profile }} logs
          exit 1

      - run: vendor/bin/phpunit --testsuite integration --filter ${{ matrix.filter }}

      - if: always()
        run: docker compose --profile ${{ matrix.profile }} down -v
