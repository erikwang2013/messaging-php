name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - run: vendor/bin/phpunit --testsuite unit

      - if: matrix.php == '8.3'
        run: vendor/bin/phpstan analyse --no-progress

  plugin-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: bash tests/Composer/plugin-smoke.sh

  php80:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - name: Lint all source files
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Unit tests on PHP 8.0 (PHPUnit 9.6)
        run: vendor/bin/phpunit -c phpunit-9.xml

      - name: Runtime smoke test
        run: php -r 'require "vendor/autoload.php"; new Erikwang2013\Messaging\Contract\Message("ok"); new Erikwang2013\Messaging\Contract\Capabilities(); echo "smoke ok\n";'
