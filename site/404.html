/* Base tokens. Project accent variables are injected by build.py. */
:root {
  color-scheme: light dark;
  --bg: #f6f7fb;
  --bg-2: #eef1f7;
  --surface: #fdfdff;
  --ink: #12141c;
  --muted: #5c6374;
  --line: rgba(18, 20, 28, .11);
  --line-strong: rgba(18, 20, 28, .2);
  --accent: #4f46e5;
  --accent-soft: rgba(79, 70, 229, .12);
  --accent-ink: #ffffff;
  --accent-readable: #4338ca;
  --shadow: 0 26px 70px rgba(18, 20, 28, .09);
  --shadow-soft: 0 12px 34px rgba(18, 20, 28, .07);
  --ink-card-bg: #12141c;
  --ink-card-fg: #f6f7fb;
  --ink-card-muted: rgba(246, 247, 251, .72);
  --radius: 22px;
  --radius-sm: 14px;
  --font: "PingFang SC", "Noto Sans SC", "Noto Sans CJK SC", "Microsoft YaHei", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --header-h: 64px;
  --ease: cubic-bezier(.16, 1, .3, 1);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117;
    --bg-2: #101722;
    --surface: #151d29;
    --ink: #edf2f8;
    --muted: #9ca7b8;
    --line: rgba(237, 242, 248, .12);
    --line-strong: rgba(237, 242, 248, .24);
    --shadow: 0 26px 70px rgba(0, 0, 0, .38);
    --shadow-soft: 0 12px 34px rgba(0, 0, 0, .28);
    --ink-card-bg: #1c2637;
    --ink-card-fg: #edf2f8;
    --ink-card-muted: rgba(237, 242, 248, .68);
  }
}

*, *::before, *::after { box-sizing: border-box; }

html, body { height: 100%; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  margin: 0;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
h1, h2, h3, p, figure { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
::selection { background: var(--accent); color: var(--accent-ink); }

:focus-visible {
  outline: 2px solid var(--accent-readable);
  outline-offset: 3px;
  border-radius: 6px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: fixed;
  left: 16px;
  top: -100px;
  z-index: 100;
  padding: 10px 16px;
  border-radius: 999px;
  background: var(--ink);
  color: var(--bg);
  font-size: 13px;
  transition: top .2s var(--ease);
}
.skip-link:focus-visible { top: 12px; }

.icon-sprite {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;
}

.icon {
  width: 1.1em;
  height: 1.1em;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}
.icon-xs { width: .95em; height: .95em; }
.icon-lg { width: 1.5em; height: 1.5em; }

/* Header */
.site-header {
  position: fixed;
  inset: 0 0 auto;
  z-index: 50;
  height: var(--header-h);
  background: var(--bg);
  border-bottom: 1px solid transparent;
  transition: border-color .3s var(--ease), box-shadow .3s var(--ease), background .3s var(--ease);
}
@supports (backdrop-filter: blur(12px)) {
  .site-header { background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(16px) saturate(150%); }
}
.site-header.is-scrolled {
  border-bottom-color: var(--line);
  box-shadow: 0 8px 30px rgba(18, 20, 28, .05);
}
.header-inner {
  width: min(1240px, 100%);
  height: 100%;
  margin: 0 auto;
  padding: 0 clamp(18px, 4vw, 44px);
  display: flex;
  align-items: center;
  gap: clamp(18px, 3vw, 38px);
}
.brand {
  display: inline-flex;

  font-weight: 750;
  letter-spacing: -.02em;
}
.brand img { width: 34px; height: 34px; object-fit: contain; }
.brand-name { white-space: nowrap; font-size: 15px; }
.brand-name small { display: block; color: var(--muted); font-family: var(--mono); font-size: 9px; font-weight: 500; letter-spacing: .1em; line-height: 1.2; text-transform: uppercase; }

.site-nav {
  display: flex;
  align-items: center;
  gap: clamp(14px, 2.2vw, 28px);
  margin-left: auto;
}
.site-nav a {
  position: relative;
  padding: 7px 0;
  font-size: 13.5px;
  color: var(--muted);
  transition: color .2s var(--ease);
  white-space: nowrap;
}
.site-nav a::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 2px;
  border-radius: 2px;
  background: var(--accent);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform .25s var(--ease);
}
.site-nav a:hover,
.site-nav a[aria-current="true"] { color: var(--ink); }
.site-nav a[aria-current="true"]::after,
.site-nav a:hover::after { transform: scaleX(1); }

.header-actions { display: flex; align-items: center; gap: 8px; margin-left: 4px; }
.lang-switch {
  display: inline-flex;
  align-items: center;
  height: 38px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--muted);
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 650;
  text-decoration: none;
  transition: color .2s var(--ease), border-color .2s var(--ease), background .2s var(--ease);
}
.lang-switch:hover { color: var(--ink); border-color: var(--line-strong); background: var(--accent-soft); }
.nav-lang { display: none; }
.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink);
  transition: transform .2s var(--ease), border-color .2s var(--ease), background .2s var(--ease);
}
.icon-btn:hover { transform: translateY(-1px); border-color: var(--line-strong); background: var(--accent-soft); }
.icon-btn:active { transform: scale(.97); }

.nav-toggle { display: none; }

/* Scroll container and sections */
.scroll-container { position: relative; }

.section {
  position: relative;
  padding: clamp(68px, 8vw, 112px) clamp(20px, 5vw, 64px);
  isolation: isolate;
}
.wrap { width: min(1200px, 100%); margin: 0 auto; }

.section-head { max-width: 720px; margin-bottom: clamp(24px, 4vh, 38px); }
.section-head h2 {
  font-size: clamp(1.85rem, 3.2vw, 3rem);
  line-height: 1.12;
  letter-spacing: -.035em;
  font-weight: 780;
  text-wrap: balance;
}
.section-head p {
  margin-top: 12px;
  color: var(--muted);
  font-size: clamp(.95rem, 1.15vw, 1.05rem);
  max-width: 58ch;
}

/* Hero */
.hero {
  overflow: clip;
  min-height: 100vh;
  min-height: 100svh;
  padding-top: calc(var(--header-h) + clamp(32px, 5vw, 72px));
  padding-bottom: clamp(52px, 7vw, 96px);
}
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -2;
  background:
    radial-gradient(580px 460px at 78% 38%, var(--accent-soft), transparent 70%),
    radial-gradient(420px 360px at 18% 82%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 72%);
  pointer-events: none;
}
#hero-canvas {
  position: absolute;
  inset: 0;
  z-index: -1;
  width: 100%;
  height: 100%;
  opacity: 0;
  transition: opacity .9s var(--ease);
  pointer-events: none;
}
.hero.has-three #hero-canvas { opacity: .62; }
.hero-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.06fr) minmax(280px, .94fr);
  align-items: center;
  gap: clamp(26px, 5vw, 74px);
}
.hero-copy { position: relative; z-index: 2; }
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.eyebrow::before {
  content: "";
  width: 22px;
  height: 1px;
  background: var(--accent);
}
.hero h1 {
  margin-top: 18px;
  font-size: clamp(2.5rem, 5.3vw, 4.9rem);
  line-height: 1.02;
  letter-spacing: -.05em;
  font-weight: 820;
}
.hero h1 span { display: block; }
.hero h1 .line-accent { color: var(--accent-readable); }
.hero-sub {
  margin-top: 22px;
  max-width: 36ch;
  color: var(--muted);
  font-size: clamp(1rem, 1.15vw, 1.12rem);
  line-height: 1.75;
  text-wrap: pretty;
}
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 0 22px;
  border: 1px solid transparent;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 650;
  white-space: nowrap;
  transition: transform .22s var(--ease), background .22s var(--ease), border-color .22s var(--ease), box-shadow .22s var(--ease);
}
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(0) scale(.985); }
.btn-primary {
  background: var(--accent);
  color: var(--accent-ink);
  box-shadow: 0 12px 26px color-mix(in srgb, var(--accent) 26%, transparent);
}
.btn-primary:hover { box-shadow: 0 16px 32px color-mix(in srgb, var(--accent) 32%, transparent); }
.btn-secondary {
  background: var(--surface);
  border-color: var(--line);
  color: var(--ink);
}
.btn-secondary:hover { border-color: var(--line-strong); background: var(--accent-soft); }

.hero-visual { position: relative; display: grid; place-items: center; min-height: min(46vh, 420px); }
.pet-stage { position: relative; width: min(100%, 380px); aspect-ratio: 1 / 1; display: grid; place-items: center; }
.pet-stage::before {
  content: "";
  position: absolute;
  inset: 12%;
  border-radius: 50%;
  background: radial-gradient(circle at 38% 32%, color-mix(in srgb, var(--accent) 20%, transparent), var(--accent-soft) 54%, transparent 72%);
  filter: blur(4px);
}
.orbit {
  position: absolute;
  border: 1px dashed color-mix(in srgb, var(--accent) 32%, var(--line));
  border-radius: 50%;
  animation: orbit-spin 34s linear infinite;
}
.orbit-1 { inset: 4%; }
.orbit-2 { inset: 17%; animation-duration: 24s; animation-direction: reverse; border-style: solid; opacity: .55; }
.orbit::after {
  content: "";
  position: absolute;
  top: -3px;
  left: 50%;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft);
}
.hero-pet {
  position: relative;
  z-index: 2;
  width: 78%;
  height: 78%;
  object-fit: contain;
  filter: drop-shadow(0 26px 30px rgba(18, 20, 28, .16));
  animation: pet-float 6.5s ease-in-out infinite;
}
.chip {
  position: absolute;
  z-index: 3;
  padding: 7px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: color-mix(in srgb, var(--surface) 86%, transparent);
  box-shadow: var(--shadow-soft);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: .02em;
  animation: chip-float 7s ease-in-out infinite;
}
.chip-a { left: -2%; top: 18%; }
.chip-b { right: -4%; top: 44%; animation-delay: -2.3s; }
.chip-c { left: 8%; bottom: 12%; animation-delay: -4.1s; }

/* About */
.about { background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%); }
.about-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(280px, .85fr);
  gap: clamp(28px, 5vw, 76px);
  align-items: center;
}
.about h2 {
  font-size: clamp(1.9rem, 3.4vw, 3.25rem);
  line-height: 1.12;
  letter-spacing: -.04em;
  font-weight: 780;
  text-wrap: balance;
}
.about-body { margin-top: 20px; display: grid; gap: 14px; max-width: 60ch; color: var(--muted); font-size: clamp(.95rem, 1.1vw, 1.05rem); }
.about-body strong { color: var(--ink); font-weight: 650; }
.points { margin-top: 22px; display: grid; gap: 10px; }
.points li { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; color: var(--ink); }
.points .icon { margin-top: 3px; color: var(--accent-readable); }
.stats {
  margin-top: 30px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--line);
}
.stat { padding: 15px 17px; background: var(--surface); }
.stat strong { display: block; font-size: clamp(1.45rem, 2.4vw, 2.1rem); line-height: 1.1; letter-spacing: -.04em; font-weight: 780; }
.stat span { display: block; margin-top: 4px; color: var(--muted); font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; }

.about-pet { position: relative; display: grid; place-items: center; }
.pet-card {
  position: relative;
  width: min(100%, 330px);
  padding: 26px 24px 22px;
  border: 1px solid var(--line);
  border-radius: 30px;
  background: var(--surface);
  box-shadow: var(--shadow);
  text-align: center;
}
.pet-card::before {
  content: "";
  position: absolute;
  inset: 10px;
  border: 1px dashed color-mix(in srgb, var(--accent) 24%, transparent);
  border-radius: 22px;
  pointer-events: none;
}
.pet-card img { position: relative; width: min(200px, 70%); height: auto; margin: 0 auto; filter: drop-shadow(0 14px 18px rgba(18, 20, 28, .12)); }
.pet-card h3 { position: relative; margin-top: 8px; font-size: 16px; letter-spacing: -.01em; }
.pet-card p { position: relative; margin-top: 4px; color: var(--muted); font-size: 12px; line-height: 1.55; }
.speech {
  position: relative;
  margin: 14px auto 0;
  display: inline-block;
  max-width: 26ch;
  padding: 9px 13px;
  border-radius: 14px;
  background: var(--accent-soft);
  color: var(--accent-readable);
  font-size: 12px;
  font-weight: 600;
}
.speech::before {
  content: "";
  position: absolute;
  left: 50%;
  top: -6px;
  width: 10px;
  height: 10px;
  background: var(--accent-soft);
  transform: translateX(-50%) rotate(45deg);
  border-radius: 2px;
}

/* Features */
.features { background: var(--bg); }
.feature-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 14px;
}
.feature-card {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 148px;
  padding: 20px 20px 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  overflow: hidden;
  transition: transform .3s var(--ease), border-color .3s var(--ease), box-shadow .3s var(--ease);
}
.feature-card:hover { transform: translateY(-4px); border-color: var(--line-strong); box-shadow: var(--shadow-soft); }
.feature-card:nth-child(1) { grid-column: span 5; }
.feature-card:nth-child(2) { grid-column: span 4; }
.feature-card:nth-child(3) { grid-column: span 3; }
.feature-card:nth-child(4) { grid-column: span 3; }
.feature-card:nth-child(5) { grid-column: span 4; }
.feature-card:nth-child(6) { grid-column: span 5; }
.feature-card .icon {
  width: 26px;
  height: 26px;
  color: var(--accent-readable);
  margin-bottom: 14px;
}
.feature-card h3 { font-size: 16px; letter-spacing: -.015em; font-weight: 700; }
.feature-card p { margin-top: 6px; color: var(--muted); font-size: 12.5px; line-height: 1.6; max-width: 34ch; }
.feature-card--accent { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 24%, var(--line)); }
.feature-card--accent .icon { color: var(--accent-readable); }
.feature-card--ink { background: var(--ink-card-bg); color: var(--ink-card-fg); border-color: color-mix(in srgb, var(--accent) 30%, var(--line)); }
.feature-card--ink p { color: var(--ink-card-muted); }
.feature-card--ink .icon { color: var(--accent); }
.feature-card--ink:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.feature-pet {
  position: absolute;
  right: 12px;
  bottom: 6px;
  width: 82px;
  height: 82px;
  object-fit: contain;
  opacity: .95;
  pointer-events: none;
}
.feature-card--pet { padding-right: 92px; }
.feature-card--pet p { max-width: 30ch; }
.feature-tag {
  position: absolute;
  right: 16px;
  top: 16px;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: .08em;
  text-transform: uppercase;
}

/* Language ports */
.ports { background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%); }
.ports-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.ports-grid--single { grid-template-columns: minmax(0, 1fr); }
.port-card {
  position: relative;
  display: grid;
  grid-template-columns: minmax(104px, .3fr) minmax(0, 1fr);
  gap: clamp(18px, 3vw, 32px);
  padding: clamp(22px, 3vw, 30px);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  overflow: hidden;
  transition: transform .3s var(--ease), border-color .3s var(--ease), box-shadow .3s var(--ease);
}
.port-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(420px 260px at 0% 0%, var(--accent-soft), transparent 72%);
  opacity: .7;
  pointer-events: none;
}
.port-card:hover {
  transform: translateY(-4px);
  border-color: color-mix(in srgb, var(--accent) 32%, var(--line));
  box-shadow: var(--shadow-soft);
}
.port-aside {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  padding-right: 12px;
  border-right: 1px solid var(--line);
}
.port-lang {
  font-family: var(--mono);
  font-size: clamp(2.4rem, 4vw, 3.9rem);
  line-height: .9;
  letter-spacing: -.08em;
  font-weight: 800;
  color: var(--accent-readable);
}
.port-version { font-family: var(--mono); font-size: 11px; font-weight: 650; color: var(--ink); }
.port-meta { font-family: var(--mono); font-size: 10px; line-height: 1.5; color: var(--muted); }
.port-main { position: relative; min-width: 0; }
.port-main h3 { font-size: 18px; letter-spacing: -.02em; font-weight: 750; }
.port-tagline { margin-top: 4px; color: var(--accent-readable); font-size: 13px; font-weight: 650; }
.port-desc { margin-top: 8px; color: var(--muted); font-size: 12.5px; line-height: 1.65; max-width: 52ch; }
.port-highlights { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.port-highlights li {
  padding: 4px 9px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--bg);
  color: var(--muted);
  font-size: 10.5px;
}
.port-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 16px;
  color: var(--accent-readable);
  font-size: 12px;
  font-weight: 650;
}
.port-link:hover { text-decoration: underline; text-underline-offset: 3px; }

/* Iterations */
.iterations { background: var(--bg-2); }
.timeline { position: relative; display: grid; gap: 0; max-width: 860px; }
.timeline::before {
  content: "";
  position: absolute;
  left: 7px;
  top: 12px;
  bottom: 12px;
  width: 1px;
  background: var(--line-strong);
}
.milestone {
  position: relative;
  display: grid;
  grid-template-columns: minmax(92px, 118px) minmax(0, 1fr) 76px;
  gap: clamp(14px, 2.6vw, 30px);
  align-items: start;
  padding: 13px 0 13px 34px;
}
.milestone::before {
  content: "";
  position: absolute;
  left: 2px;
  top: 21px;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 5px var(--accent-soft);
}
.milestone-ver { font-family: var(--mono); font-size: 12.5px; font-weight: 650; color: var(--accent-readable); }
.milestone time { display: block; margin-top: 3px; color: var(--muted); font-family: var(--mono); font-size: 10px; letter-spacing: .04em; }
.milestone h3 { font-size: 16px; letter-spacing: -.01em; }
.milestone p { margin-top: 4px; color: var(--muted); font-size: 12.5px; line-height: 1.6; max-width: 54ch; }
.milestone-pet { width: 68px; height: 68px; object-fit: contain; justify-self: end; opacity: .9; }

/* Versions */
.versions { background: var(--bg); }
.versions-grid {
  display: grid;
  grid-template-columns: minmax(220px, .72fr) minmax(0, 1.55fr);
  gap: clamp(28px, 5vw, 74px);
  align-items: start;
}
.versions-intro h2 {
  font-size: clamp(1.9rem, 3.2vw, 3rem);
  line-height: 1.12;
  letter-spacing: -.04em;
  font-weight: 780;
}
.versions-intro p { margin-top: 12px; color: var(--muted); font-size: 14px; max-width: 36ch; }
.latest-badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin-top: 18px;
  padding: 7px 12px;
  border: 1px solid color-mix(in srgb, var(--accent) 28%, var(--line));
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent-readable);
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 650;
}
.latest-badge .icon { width: 13px; height: 13px; }
.versions-intro .btn { margin-top: 20px; }
.release-list { display: grid; }
.release {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr) 20px;
  gap: 16px;
  align-items: baseline;
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
}
.release:last-child { border-bottom: 0; }
.release-ver { display: block; font-family: var(--mono); font-size: 12.5px; font-weight: 650; color: var(--accent-readable); }
.release-date { display: block; margin-top: 2px; color: var(--muted); font-family: var(--mono); font-size: 10px; letter-spacing: .03em; }
.release-body p { color: var(--ink); font-size: 13px; line-height: 1.5; }
.release-body span { display: block; margin-top: 2px; color: var(--muted); font-size: 10.5px; font-family: var(--mono); }
.release a { color: var(--muted); transition: color .2s var(--ease), transform .2s var(--ease); }
.release a:hover { color: var(--accent-readable); transform: translate(2px, -2px); }

/* Pet expressions */
.pets { background: var(--bg-2); }
.pet-grid {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 12px;
}
.pet-tile {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  gap: 4px;
  min-height: 146px;
  padding: 12px 8px 10px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--surface);
  overflow: hidden;
  cursor: zoom-in;
  transition: transform .3s var(--ease), border-color .3s var(--ease), background .3s var(--ease);
}
.pet-tile::before {
  content: "";
  position: absolute;
  inset: auto -20% -46% -20%;
  height: 68%;
  border-radius: 50%;
  background: var(--accent-soft);
  opacity: 0;
  transition: opacity .3s var(--ease);
}
.pet-tile:hover { transform: translateY(-5px); border-color: color-mix(in srgb, var(--accent) 36%, var(--line)); }
.pet-tile:hover::before { opacity: 1; }
.pet-tile img { position: relative; width: 104px; height: 100px; object-fit: contain; transition: transform .3s var(--ease); }
.pet-tile:hover img { transform: scale(1.08) rotate(-3deg); }
.pet-tile span { position: relative; color: var(--muted); font-size: 11px; }

/* Download */
.download { background: var(--bg); }
.download-panel {
  display: grid;
  grid-template-columns: 120px minmax(0, 1fr) auto;
  gap: 24px;
  align-items: center;
  padding: 26px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow-soft);
}
.download-panel img { width: 100px; height: 100px; object-fit: contain; }
.download-panel h3 { font-size: 18px; }
.download-panel p { margin-top: 4px; color: var(--muted); font-size: 13px; }
.download-list { display: grid; gap: 8px; margin-top: 12px; }
.download-list a { display: inline-flex; align-items: center; gap: 8px; color: var(--accent-readable); font-size: 13px; font-weight: 600; }

/* Gallery */
.gallery { background: var(--bg-2); }
.gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.gallery-item {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 9px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--surface);
  text-align: left;
  cursor: zoom-in;
  transition: transform .3s var(--ease), border-color .3s var(--ease), box-shadow .3s var(--ease);
}
.gallery-item:hover { transform: translateY(-4px); border-color: color-mix(in srgb, var(--accent) 32%, var(--line)); box-shadow: var(--shadow-soft); }
.gallery-item img {
  width: 100%;
  height: 222px;
  object-fit: contain;
  padding: 10px;
  border-radius: 13px;
  background: #ffffff;
}
.gallery-caption { padding: 0 4px 4px; color: var(--muted); font-size: 12px; }

/* Docs */
.docs { background: var(--bg); }
.docs-panel {
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow-soft);
}
.docs-tabs { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.docs-tab {
  padding: 7px 15px;
  border: 1px solid transparent;
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 11.5px;
  font-weight: 650;
  cursor: pointer;
  transition: background .2s var(--ease), color .2s var(--ease), border-color .2s var(--ease);
}
.docs-tab:hover { color: var(--ink); border-color: var(--line); }
.docs-tab.is-active { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 28%, var(--line)); color: var(--accent-readable); }
.docs-pane { padding-top: 16px; }
.docs-pane[hidden] { display: none; }
.docs-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--muted); font-family: var(--mono); font-size: 10.5px; }
.docs-meta a { display: inline-flex; align-items: center; gap: 4px; color: var(--accent-readable); }
.docs-meta a:hover { text-decoration: underline; text-underline-offset: 3px; }
.docs-code-grid { display: grid; grid-template-columns: minmax(0, .82fr) minmax(0, 1.18fr); gap: 14px; margin-top: 12px; align-items: start; }
.code-block {
  min-width: 0;
  padding: 14px 16px;
  border-radius: 16px;
  background: var(--ink-card-bg);
  color: var(--ink-card-fg);
}
.code-label { display: block; margin-bottom: 8px; color: var(--ink-card-muted); font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; }
.code-block pre { margin: 0; max-height: 300px; overflow: auto; }
.code-block code { display: block; color: var(--ink-card-fg); font-family: var(--mono); font-size: 11.5px; line-height: 1.62; white-space: pre; }
.code-block--install code { white-space: pre-wrap; overflow-wrap: anywhere; }

/* Search */
.search-dialog {
  width: min(760px, 92vw);
  max-height: 84vh;
  padding: 0;
  border: 0;
  background: transparent;
  overflow: visible;
}
.search-dialog::backdrop { background: rgba(8, 12, 20, .72); backdrop-filter: blur(6px); }
.search-panel {
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: var(--surface);
  box-shadow: 0 34px 90px rgba(0, 0, 0, .35);
}
.search-bar { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.search-bar .icon { width: 20px; height: 20px; color: var(--muted); }
.search-input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 16px;
}
.search-input::placeholder { color: var(--muted); }
.search-input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
.search-kbd {
  padding: 2px 7px;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 10px;
}
.search-close {
  width: 32px;
  height: 32px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--surface);
  color: var(--ink);
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
}
.search-hint { margin-top: 12px; color: var(--muted); font-size: 12px; }
.search-results { margin-top: 8px; max-height: 46vh; overflow: auto; }
.search-results:empty { display: none; }
.search-result {
  display: block;
  width: 100%;
  padding: 11px 10px;
  border: 0;
  border-bottom: 1px solid var(--line);
  border-radius: 10px;
  background: transparent;
  text-align: left;
  cursor: pointer;
}
.search-result:last-child { border-bottom: 0; }
.search-result:hover,
.search-result.is-active { background: var(--accent-soft); }
.search-result-type { display: block; color: var(--muted); font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; }
.search-result strong { display: block; margin-top: 2px; color: var(--ink); font-size: 13.5px; font-weight: 650; }
.search-result-snippet { display: block; margin-top: 3px; color: var(--muted); font-size: 11.5px; line-height: 1.55; }
.search-result mark { padding: 0 1px; border-radius: 3px; background: var(--accent-soft); color: var(--accent-readable); }
.search-status { margin-top: 10px; color: var(--muted); font-size: 11px; }

/* Donation and lightbox */
.footer-donate {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
  margin-top: 24px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
}
.donate-copy strong { display: block; font-size: 13.5px; letter-spacing: -.01em; }
.donate-copy span { display: block; margin-top: 3px; color: var(--muted); font-size: 11.5px; }
.donate-qrs { display: flex; gap: 12px; flex-wrap: wrap; }
.qr-thumb {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 7px 11px 7px 7px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface);
  cursor: zoom-in;
  transition: transform .2s var(--ease), border-color .2s var(--ease);
}
.qr-thumb:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 32%, var(--line)); }
.qr-thumb img { width: 52px; height: 52px; padding: 3px; border-radius: 9px; background: #ffffff; object-fit: contain; }
.qr-thumb span { color: var(--muted); font-size: 11.5px; }

.lightbox {
  width: min(1160px, 94vw);
  max-width: min(1160px, 94vw);
  max-height: 92vh;
  padding: 0;
  border: 0;
  background: transparent;
  overflow: visible;
}
.lightbox::backdrop { background: rgba(8, 12, 20, .78); backdrop-filter: blur(6px); }
.lightbox-inner {
  position: relative;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--surface);
  box-shadow: 0 34px 90px rgba(0, 0, 0, .35);
}
.lightbox-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 4px 10px; }
.lightbox-zoom-controls { display: inline-flex; align-items: center; gap: 5px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
.lightbox-zoom-controls button {
  min-width: 32px;
  height: 32px;
  padding: 0 8px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font-family: var(--mono);
  font-size: 17px;
  line-height: 1;
  cursor: pointer;
}
.lightbox-zoom-controls button:hover { background: var(--accent-soft); color: var(--accent-readable); }
.lightbox-zoom-reset { min-width: 58px !important; font-size: 10.5px !important; font-weight: 650; }
.lightbox-close {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--surface);
  color: var(--ink);
  font-size: 19px;
  line-height: 1;
  cursor: pointer;
}
.lightbox-close:hover { background: var(--accent-soft); border-color: var(--line-strong); }
.lightbox-stage {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: 1080px;
  height: min(70vh, 740px);
  overflow: hidden;
  border-radius: 13px;
  background: #ffffff;
  touch-action: none;
}
.lightbox-stage img {
  display: block;
  width: auto;
  height: auto;
  max-width: none;
  max-height: none;
  padding: 0;
  border-radius: 0;
  background: transparent;
  object-fit: contain;
  flex: none;
  transform: translate(0, 0);
  transform-origin: center center;
  will-change: transform, width, height;
  user-select: none;
  -webkit-user-drag: none;
}
.lightbox-stage.is-zoomed { cursor: grab; }
.lightbox-stage.is-dragging { cursor: grabbing; }
.lightbox-caption { margin-top: 9px; color: var(--muted); font-size: 12px; text-align: center; }

/* Footer */
.section.footer {
  min-height: auto;
  align-items: stretch;
  padding-block: 52px 34px;
  background: var(--bg-2);
  border-top: 1px solid var(--line);
}
.footer-inner { width: min(1200px, 100%); margin: 0 auto; }
.footer-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 28px; flex-wrap: wrap; }
.footer-brand { display: flex; align-items: center; gap: 13px; }
.footer-brand img { width: 52px; height: 52px; object-fit: contain; }
.footer-brand strong { display: block; font-size: 16px; letter-spacing: -.02em; }
.footer-brand span { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
.footer-links { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; font-size: 13px; }
.footer-links a { color: var(--muted); transition: color .2s var(--ease); }
.footer-links a:hover { color: var(--accent-readable); }
.footer-links a .icon { display: inline; vertical-align: -2px; margin-left: 3px; }
.footer-bottom {
  margin-top: 30px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  color: var(--muted);
  font-size: 11.5px;
}
.footer-info { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
#busuanzi { display: inline-flex; align-items: center; gap: 4px; }
#busuanzi b { color: var(--ink); font-family: var(--mono); font-weight: 650; }

/* Section dots */
.section-dots {
  position: fixed;
  right: 18px;
  top: 50%;
  z-index: 40;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 11px;
}
.section-dots a {
  position: relative;
  display: block;
  width: 9px;
  height: 9px;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  background: var(--bg);
  transition: transform .2s var(--ease), background .2s var(--ease), border-color .2s var(--ease);
}
.section-dots a:hover { border-color: var(--accent); }
.section-dots a.is-active { background: var(--accent); border-color: var(--accent); transform: scale(1.35); }
.section-dots a span {
  position: absolute;
  right: 20px;
  top: 50%;
  transform: translateY(-50%) translateX(4px);
  padding: 4px 9px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink);
  font-size: 10.5px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s var(--ease), transform .2s var(--ease);
}
.section-dots a:hover span,
.section-dots a:focus-visible span { opacity: 1; transform: translateY(-50%) translateX(0); }

/* Back to top pet */
.pet-top {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 60;
  width: 62px;
  height: 62px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--surface);
  box-shadow: var(--shadow);
  cursor: pointer;
  display: grid;
  place-items: center;
  opacity: 0;
  visibility: hidden;
  transform: translateY(14px) scale(.94);
  transition: opacity .3s var(--ease), transform .3s var(--ease), visibility .3s, border-color .2s var(--ease);
}
.pet-top.is-visible { opacity: 1; visibility: visible; transform: none; }
.pet-top:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.pet-top img { grid-area: 1 / 1; width: 52px; height: 52px; object-fit: contain; transition: opacity .2s var(--ease), transform .2s var(--ease); }
.pet-top .pet-hover { opacity: 0; transform: scale(.9); }
.pet-top:hover .pet-idle { opacity: 0; transform: scale(.9); }
.pet-top:hover .pet-hover { opacity: 1; transform: none; }
.pet-top-label {
  position: absolute;
  right: 70px;
  top: 50%;
  transform: translateY(-50%) translateX(5px);
  padding: 4px 9px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink);
  font-size: 10.5px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s var(--ease), transform .2s var(--ease);
}
.pet-top:hover .pet-top-label,
.pet-top:focus-visible .pet-top-label { opacity: 1; transform: translateY(-50%) translateX(0); }

/* Reveal */
.reveal {
  opacity: 0;
  transform: translateY(18px);
  transition: opacity .7s var(--ease), transform .7s var(--ease);
  transition-delay: var(--delay, 0ms);
}
.reveal.is-visible { opacity: 1; transform: none; }

/* Motion */
@keyframes pet-float {
  0%, 100% { transform: translateY(0) rotate(-1deg); }
  50% { transform: translateY(-12px) rotate(1deg); }
}
@keyframes orbit-spin { to { transform: rotate(360deg); } }
@keyframes chip-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}

/* Tablet */
@media (max-width: 1040px) {
  .hero-grid { grid-template-columns: minmax(0, 1fr) minmax(250px, .8fr); gap: 30px; }
  .about-grid { grid-template-columns: minmax(0, 1.1fr) minmax(250px, .9fr); gap: 32px; }
  .feature-card:nth-child(1), .feature-card:nth-child(6) { grid-column: span 6; }
  .feature-card:nth-child(2), .feature-card:nth-child(3), .feature-card:nth-child(4), .feature-card:nth-child(5) { grid-column: span 6; }
  .pet-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .port-card { grid-template-columns: 1fr; gap: 14px; }
  .port-aside { flex-direction: row; align-items: baseline; flex-wrap: wrap; gap: 10px; padding: 0 0 10px; border-right: 0; border-bottom: 1px solid var(--line); }
  .port-lang { font-size: 2.8rem; }
}

@media (min-width: 821px) {
  html[lang="en"] .hero h1 { font-size: clamp(2.4rem, 4.2vw, 3.9rem); letter-spacing: -.045em; }
}

/* Mobile */
@media (max-width: 900px) {
  .header-actions a.icon-btn[href] { display: none; }
}

@media (max-width: 820px) {
  :root { --header-h: 60px; }
  .header-actions .lang-switch { display: none; }
  .site-nav .nav-lang { display: block; }
  body { overflow-x: hidden; }
  .section {
    padding: 56px 18px 64px;
  }
  .hero {
    padding-top: calc(var(--header-h) + 28px);
    padding-bottom: 48px;
  }
  .header-inner { gap: 10px; padding: 0 14px; }
  .brand img { width: 30px; height: 30px; }
  .brand-name { font-size: 13.5px; }
  .brand-name small { display: none; }
  .site-nav {
    position: fixed;
    left: 12px;
    right: 12px;
    top: calc(var(--header-h) + 8px);
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    padding: 8px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--surface);
    box-shadow: var(--shadow);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-6px);
    transition: opacity .22s var(--ease), transform .22s var(--ease), visibility .22s;
    margin-left: 0;
  }
  .site-nav.is-open { opacity: 1; visibility: visible; transform: none; }
  .site-nav a { padding: 11px 12px; border-radius: 10px; font-size: 14px; }
  .site-nav a::after { display: none; }
  .site-nav a[aria-current="true"] { background: var(--accent-soft); color: var(--ink); }
  .site-nav .nav-lang { margin-top: 4px; border-top: 1px solid var(--line); border-radius: 0 0 10px 10px; color: var(--accent-readable); }
  .nav-toggle {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    margin-left: auto;
    border: 1px solid var(--line);
    border-radius: 999px;

  .nav-toggle-bars,

    display: block;
    width: 15px;

  .nav-toggle-bars { position: relative; }

  .nav-toggle[aria-expanded="true"] .nav-toggle-bars { background: transparent; }
